name: CurseForge to Discord

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch: {}     # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: cf-feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check.js
      - name: Save what was seen
        if: always()
        run: |
          git config user.name "cf-feed-bot"
          git config user.email "cf-feed-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update seen files" && git push)
